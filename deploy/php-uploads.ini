; PHP's half of the same limit.
;
; Forge → Servers → your server → PHP → (8.4) → Edit PHP-FPM / php.ini, or
; over SSH in /etc/php/8.4/fpm/php.ini, then restart FPM.
;
; nginx is only the first gate. PHP has two more, and when a POST exceeds
; post_max_size PHP discards the body entirely — Laravel then sees a request
; with no files and reports a validation error about a missing photograph,
; which sends you looking in exactly the wrong place.
;
; upload_max_filesize must be at least the API's own max_upload_kilobytes
; (config/listings.php, 12288 KB), and post_max_size must exceed it, because
; the body carries the fields as well as the file.

upload_max_filesize = 16M
post_max_size = 64M

; Fifteen photographs in one request, plus headroom. PHP's default is 20.
max_file_uploads = 25
