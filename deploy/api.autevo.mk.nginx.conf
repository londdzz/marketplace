# Upload limits for the API site.
#
# Forge → Sites → api.autevo.mk → Edit Nginx Configuration, and put this line
# inside the `server { }` block, near the top beside `root`.
#
# nginx's own default is 1 megabyte, and it refuses anything larger before
# Laravel is ever reached — so the API's own rule, which allows 12 MB a
# photograph, never gets a say. Worse, nginx answers that refusal with an HTML
# page, and a client expecting JSON reports it as "unexpected character <"
# rather than as a photograph being too big.
#
# 64m rather than 12m because the endpoint takes up to fifteen photographs in
# one request. It is a ceiling, not an allocation: nothing is reserved and a
# small upload costs exactly what it did before.
client_max_body_size 64m;
