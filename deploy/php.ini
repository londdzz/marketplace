; Drop into /etc/php/8.4/fpm/conf.d/99-autevo.ini and restart php8.4-fpm.
;
; These exist because of one thing: a listing takes up to 15 photographs and
; the API accepts 12 MB each. PHP's defaults (2 MB per file, 8 MB per request,
; 20 files) reject a normal upload, and it fails as a 413 the app cannot
; explain to the seller. nginx's client_max_body_size has to match.

upload_max_filesize = 12M
post_max_size = 200M
max_file_uploads = 20

; Re-encoding fifteen photographs takes longer than the default 30 seconds.
max_execution_time = 300
memory_limit = 512M

; Nothing about the server goes in a response header.
expose_php = Off

; Laravel compiles its own views and routes; this is the production setting.
opcache.enable = 1
opcache.memory_consumption = 192
opcache.max_accelerated_files = 20000
opcache.validate_timestamps = 0
