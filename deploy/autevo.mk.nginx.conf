# The website, served as static files from the same box as the API.
#
# Forge → Sites → autevo.mk → Edit Nginx Configuration, and replace the
# `location /` block it generated with the two below. Everything else Forge
# wrote — the certificate, the listen lines, the logs — stays as it is.
#
# Only needed when the site is served from this server. Cloudflare Pages reads
# web/public/_redirects instead and none of this applies.

# Hashed filenames, so they can be cached for a year: a new build writes a new
# name rather than changing this one.
location /assets/ {
    expires 1y;
    add_header Cache-Control "public, immutable";
    try_files $uri =404;
}

# Everything else is the app. try_files hands over a real file where one
# exists and index.html where none does, so /listing/<uuid> loads the site
# and the router takes it from there rather than nginx answering 404.
#
# index.html itself is never cached: it names the current build's assets, and
# a stale copy points at files the last deploy deleted.
location / {
    try_files $uri $uri/ /index.html;
    add_header Cache-Control "no-cache";
}
