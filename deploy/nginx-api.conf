# nginx for api.autevo.mk.
#
# Forge writes a file like this for you and you only need the two marked
# blocks below. Use the whole file if you are setting the server up by hand.

server {
    listen 80;
    listen [::]:80;
    server_name api.autevo.mk;
    # Let's Encrypt answers here; everything else goes to HTTPS.
    location /.well-known/acme-challenge/ { root /var/www/html; }
    location / { return 301 https://$host$request_uri; }
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name api.autevo.mk;

    root /home/forge/api.autevo.mk/api/public;
    index index.php;
    charset utf-8;

    ssl_certificate     /etc/letsencrypt/live/api.autevo.mk/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/api.autevo.mk/privkey.pem;

    # ---- BLOCK 1: photo uploads --------------------------------------------
    # A listing takes up to 15 photographs and the API accepts 12 MB each, so
    # a single request can legitimately be large. nginx's default is 1 MB,
    # which fails the upload with a 413 the app cannot explain. PHP's own
    # post_max_size and max_file_uploads have to match — see deploy/php.ini.
    client_max_body_size 200M;
    client_body_timeout 300s;

    # Photographs are re-encoded on the way in, which is not instant.
    fastcgi_read_timeout 300s;

    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options DENY always;
    add_header Referrer-Policy no-referrer always;

    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    # ---- BLOCK 2: PHP ------------------------------------------------------
    location ~ \.php$ {
        fastcgi_pass unix:/var/run/php/php8.4-fpm.sock;
        fastcgi_index index.php;
        fastcgi_param SCRIPT_FILENAME $realpath_root$fastcgi_script_name;
        include fastcgi_params;
        fastcgi_hide_header X-Powered-By;
    }

    # Nothing under these is ever served.
    location ~ /\.(?!well-known).* { deny all; }
    location ~ ^/(storage|bootstrap)/ { deny all; }

    access_log /var/log/nginx/api.autevo.mk-access.log;
    error_log  /var/log/nginx/api.autevo.mk-error.log error;
}
